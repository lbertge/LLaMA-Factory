### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# Multi-task binding specialist (Reviewer 2uf3 Q5): one model across all three categories.
# Datasets concatenated; each keeps its own schema (RA: goal/variables/constraints,
# transportation: supplies/demands/cost_matrix, JSSP: n_jobs/processing_times/...).
# Uses the CAPPED transportation set to match the paper's headline transport specialist (96%).
dataset: binding_train_2_11,binding_train_transportation_capped,binding_train_jssp
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /home/azureuser/cloudfiles/code/Users/afge/models/qwen2_5_7B/full/binding_multitask
logging_steps: 10
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: binding-sft-7B-multitask

### train
# Identical hyperparameters to the per-category 7B specialists (binding_7B.yaml) so the
# only variable is single- vs multi-task. Effective batch = 1 x 8 x 2 GPUs = 16.
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
